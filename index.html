<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FnB Dashboard</title>
  <script src="config.js?v=2"></script>
  <style>
    :root{color-scheme:dark;--bg:#0b1119;--panel:#111b27;--line:#273445;--red:#c3002f;--text:#edf2f7;--muted:#a8b5c5}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{height:100vh;width:100%;margin:0;padding:0}iframe{width:100%;height:100%;border:0;background:#fff}.setup{max-width:720px;margin:8vh auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:16px;line-height:1.6}.setup h1{font-size:22px}.setup code{overflow-wrap:anywhere;color:#ffd3dd}.setup li{margin:12px 0}.btn{display:inline-block;background:var(--red);color:white;text-decoration:none;border-radius:9px;padding:10px 15px;font-weight:600;margin-top:8px}.muted{color:var(--muted)}
  </style>
</head>
<body>
  <main id="main"></main>
  <script>
    (function(){
      const cfg=window.FNB_DASHBOARD_CONFIG||{};
      document.title=cfg.APP_TITLE||'FnB Dashboard';
      const url=(cfg.GAS_WEB_APP_URL||'').trim();
      const main=document.getElementById('main');
      const validUrl=/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:[?#].*)?$/.test(url);
      if(validUrl){
        const iframe=document.createElement('iframe'); iframe.src=url; iframe.title='FnB Dashboard'; iframe.allow='clipboard-read; clipboard-write'; main.appendChild(iframe);
      } else {
        main.innerHTML='<section class="setup"><h1>Dashboard belum dikonfigurasi</h1><p>GitHub Pages ini berfungsi sebagai launcher untuk dashboard Google Apps Script.</p><ol><li>Di repository GitHub, buka <b>config.js</b> lalu klik Edit.</li><li>Ganti <code>PASTE_URL_GAS_WEB_APP_DI_SINI</code> dengan URL deployment Web App Apps Script (URL berakhiran <code>/exec</code>).</li><li>Commit perubahan, lalu refresh halaman GitHub Pages.</li></ol><p class="muted">Pastikan Web App Apps Script telah di-deploy dan memiliki akses yang sesuai.</p></section>';
      }
    })();
  </script>
</body>
</html>
